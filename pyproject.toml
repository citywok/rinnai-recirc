[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rinnai-recirc"
version = "0.1.0"
description = "Flow-triggered hot-water recirculation for Rinnai tankless heaters with the RWM Wi-Fi module (local console, no cloud)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Andrew Parisio" }]
requires-python = ">=3.9"
keywords = ["rinnai", "tankless", "recirculation", "hot-water", "home-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
gpio = ["gpiozero"]
dev = ["pytest"]

[project.scripts]
rinnai-recirc = "recirc_flow:main"

[tool.setuptools]
py-modules = ["recirc_flow"]
